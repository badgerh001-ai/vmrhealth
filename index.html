<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>V MR HEALTH — Order Online</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#060d04;
  --bg2:#0d1a08;
  --card:#111f0a;
  --card2:#162810;
  --green:#6fcf2a;
  --green2:#4da810;
  --green-dim:rgba(111,207,42,0.12);
  --green-glow:rgba(111,207,42,0.25);
  --gold:#f0b429;
  --white:#f5fdf0;
  --muted:rgba(245,253,240,0.45);
  --border:rgba(111,207,42,0.18);
  --radius:16px;
}

html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── BACKGROUND ── */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-fx .b{position:absolute;border-radius:50%;filter:blur(100px);opacity:.13;}
.bg-fx .b1{width:700px;height:700px;background:radial-gradient(#3d8a00,#0a2000);top:-200px;left:-200px;animation:bdrift 18s ease-in-out infinite alternate;}
.bg-fx .b2{width:500px;height:500px;background:radial-gradient(#5cb800,#0d2e00);bottom:-150px;right:-150px;animation:bdrift 14s ease-in-out infinite alternate-reverse;}
.bg-fx .b3{width:300px;height:300px;background:radial-gradient(#7ed321,#1a4a00);top:40%;left:50%;animation:bdrift 20s ease-in-out infinite alternate;}
@keyframes bdrift{0%{transform:translate(0,0);}100%{transform:translate(40px,30px) scale(1.1);}}

.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px;}

/* ── HERO ── */
.hero{
  position:relative;z-index:10;
  text-align:center;
  padding:48px 24px 32px;
  border-bottom:1px solid var(--border);
}
.hero img{
  width:180px;max-width:55vw;
  filter:drop-shadow(0 0 28px var(--green-glow));
  animation:fadeDown .8s ease both;
}
.hero-sub{
  margin-top:10px;
  font-size:clamp(11px,2vw,13px);
  letter-spacing:.28em;
  color:var(--muted);
  text-transform:uppercase;
  animation:fadeDown .8s .15s ease both;
}
.hero-tagline{
  margin-top:6px;
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:clamp(13px,2.5vw,16px);
  color:var(--green);
  animation:fadeDown .8s .25s ease both;
}
.address-bar{
  margin-top:14px;
  display:inline-flex;gap:20px;flex-wrap:wrap;justify-content:center;
  font-size:12px;color:var(--muted);letter-spacing:.04em;
  animation:fadeDown .8s .35s ease both;
}
.address-bar span{display:flex;align-items:center;gap:5px;}
.address-bar .dot{width:4px;height:4px;border-radius:50%;background:var(--green);}

@keyframes fadeDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}

/* ── DAY TABS ── */
.tabs-wrap{
  position:sticky;top:0;z-index:50;
  background:rgba(6,13,4,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0 16px;
}
.tabs{
  display:flex;gap:4px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:12px 0;
  max-width:800px;margin:0 auto;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex-shrink:0;
  padding:8px 18px;
  border-radius:50px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:500;
  cursor:pointer;
  transition:all .25s;
  white-space:nowrap;
}
.tab:hover{color:var(--white);border-color:rgba(111,207,42,.4);}
.tab.active{
  background:var(--green);
  color:#060d04;
  border-color:var(--green);
  font-weight:600;
  box-shadow:0 0 20px var(--green-glow);
}

/* ── CONTENT ── */
.content{position:relative;z-index:10;max-width:900px;margin:0 auto;padding:32px 16px 120px;}

.day-panel{display:none;}
.day-panel.active{display:block;animation:panelIn .35s ease both;}
@keyframes panelIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* ── MEAL SECTION ── */
.meal-section{margin-bottom:36px;}
.section-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:20px;
}
.section-label{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:.12em;
  color:var(--green);
}
.section-line{flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent);}
.section-time{
  font-size:11px;letter-spacing:.15em;color:var(--muted);
  text-transform:uppercase;
  background:var(--green-dim);
  padding:3px 10px;border-radius:20px;
}

/* ── ITEM GRID ── */
.items-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:12px;
}

.item-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  display:flex;flex-direction:column;
  gap:10px;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  cursor:default;
}
.item-card:hover{
  transform:translateY(-2px);
  border-color:rgba(111,207,42,.4);
  box-shadow:0 8px 32px rgba(111,207,42,.08);
}
.item-name{
  font-size:14px;font-weight:500;
  color:var(--white);line-height:1.3;
}
.item-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.item-price{
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;letter-spacing:.05em;
  color:var(--gold);
}
.item-price span{font-size:13px;font-family:'DM Sans',sans-serif;color:var(--muted);font-weight:400;}

.add-btn{
  display:flex;align-items:center;gap:0;
  background:var(--green-dim);
  border:1px solid var(--border);
  border-radius:50px;
  overflow:hidden;
}
.qty-btn{
  width:30px;height:30px;
  background:none;border:none;
  color:var(--green);
  font-size:18px;font-weight:600;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.qty-btn:hover{background:rgba(111,207,42,.2);}
.qty-display{
  min-width:28px;text-align:center;
  font-size:13px;font-weight:600;color:var(--white);
}
.quick-add{
  padding:6px 14px;
  background:var(--green);
  color:#060d04;
  border:none;border-radius:50px;
  font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:600;
  cursor:pointer;
  transition:background .2s,transform .15s;
  letter-spacing:.04em;
}
.quick-add:hover{background:#8fe63a;transform:scale(1.04);}
.quick-add:active{transform:scale(.97);}

/* ── CART BUTTON ── */
.cart-fab{
  position:fixed;bottom:28px;right:24px;z-index:200;
  background:var(--green);
  color:#060d04;
  border:none;border-radius:50px;
  padding:14px 22px;
  display:flex;align-items:center;gap:10px;
  font-family:'DM Sans',sans-serif;
  font-weight:700;font-size:14px;
  cursor:pointer;
  box-shadow:0 8px 32px rgba(111,207,42,.35);
  transition:transform .2s,box-shadow .2s;
  letter-spacing:.02em;
}
.cart-fab:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(111,207,42,.45);}
.cart-fab .cart-count{
  background:#060d04;color:var(--green);
  border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;
}
.cart-fab.hidden{display:none;}

/* ── CART DRAWER ── */
.drawer-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;
  transition:opacity .3s;
}
.drawer-overlay.open{opacity:1;pointer-events:all;}

.drawer{
  position:fixed;right:0;top:0;bottom:0;z-index:301;
  width:min(440px,100vw);
  background:var(--bg2);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
.drawer.open{transform:translateX(0);}

.drawer-head{
  padding:20px 24px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.drawer-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.1em;color:var(--green);}
.drawer-close{
  width:36px;height:36px;border-radius:50%;
  background:var(--green-dim);border:1px solid var(--border);
  color:var(--white);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.drawer-close:hover{background:rgba(111,207,42,.25);}

.drawer-body{flex:1;overflow-y:auto;padding:20px 24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.drawer-empty{
  text-align:center;padding:60px 0;
  color:var(--muted);font-size:14px;
}
.drawer-empty .empty-icon{font-size:48px;margin-bottom:12px;}

.cart-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 0;border-bottom:1px solid rgba(111,207,42,.08);
}
.ci-info{flex:1;}
.ci-name{font-size:14px;font-weight:500;color:var(--white);margin-bottom:3px;}
.ci-price{font-size:13px;color:var(--gold);}
.ci-ctrl{display:flex;align-items:center;gap:4px;}
.ci-btn{
  width:28px;height:28px;border-radius:50%;
  background:var(--green-dim);border:1px solid var(--border);
  color:var(--green);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.ci-btn:hover{background:rgba(111,207,42,.25);}
.ci-qty{min-width:28px;text-align:center;font-size:13px;font-weight:600;}
.ci-remove{
  background:none;border:none;color:rgba(255,100,100,.5);
  font-size:18px;cursor:pointer;padding:4px;
  transition:color .2s;
}
.ci-remove:hover{color:#ff6464;}

.drawer-foot{
  padding:20px 24px;
  border-top:1px solid var(--border);
}
.cart-total{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;
}
.total-label{font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.total-amt{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold);}

/* ── CHECKOUT FORM ── */
.checkout-section{display:none;}
.checkout-section.visible{display:block;}
.cart-section{display:block;}
.cart-section.hidden{display:none;}

.form-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;letter-spacing:.1em;color:var(--green);
  margin-bottom:14px;
}
.form-group{margin-bottom:12px;}
.form-group label{
  display:block;font-size:11px;letter-spacing:.1em;
  color:var(--muted);text-transform:uppercase;margin-bottom:6px;
}
.form-group input,
.form-group textarea{
  width:100%;padding:12px 14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  outline:none;
  transition:border-color .2s;
  resize:none;
}
.form-group input:focus,
.form-group textarea:focus{border-color:rgba(111,207,42,.5);}
.form-group input::placeholder,
.form-group textarea::placeholder{color:rgba(245,253,240,.2);}

.wa-btn{
  width:100%;padding:16px;
  background:linear-gradient(135deg,#25d366,#128c3e);
  color:#fff;border:none;border-radius:12px;
  font-family:'DM Sans',sans-serif;
  font-weight:700;font-size:15px;
  letter-spacing:.04em;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .2s,box-shadow .2s;
  box-shadow:0 4px 20px rgba(37,211,102,.3);
}
.wa-btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(37,211,102,.4);}
.wa-btn svg{width:22px;height:22px;flex-shrink:0;}

.back-btn{
  width:100%;padding:10px;margin-top:10px;
  background:none;border:1px solid var(--border);border-radius:10px;
  color:var(--muted);font-size:13px;cursor:pointer;
  transition:border-color .2s,color .2s;
}
.back-btn:hover{border-color:rgba(111,207,42,.4);color:var(--white);}

.proceed-btn{
  width:100%;padding:14px;
  background:var(--green);color:#060d04;
  border:none;border-radius:12px;
  font-family:'DM Sans',sans-serif;
  font-weight:700;font-size:14px;
  cursor:pointer;
  transition:background .2s,transform .15s;
}
.proceed-btn:hover{background:#8fe63a;transform:translateY(-1px);}

/* ── FOOTER ── */
.site-footer{
  position:relative;z-index:10;
  text-align:center;
  padding:20px;
  border-top:1px solid var(--border);
  font-size:11px;color:rgba(245,253,240,.2);
  letter-spacing:.08em;
}
.site-footer span{color:var(--green);}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  z-index:500;
  background:var(--green);color:#060d04;
  padding:10px 22px;border-radius:50px;
  font-size:13px;font-weight:600;
  opacity:0;transition:opacity .3s,transform .3s;
  pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:480px){
  .items-grid{grid-template-columns:1fr 1fr;}
  .item-name{font-size:13px;}
}
@media(max-width:360px){
  .items-grid{grid-template-columns:1fr;}
}
</style>
</head>

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SECTIONS = [
  {key:"morning",label:"Morning Menu",time:"7 AM – 11 AM"},
  {key:"afternoon",label:"Afternoon Meals",time:"12 PM – 3 PM"},
  {key:"evening",label:"Evening Menu",time:"4 PM – 9 PM"}
];

// ── STATE ──
let cart = {}; // key: "dayIdx_section_itemName" → {name, price, qty, day, section}
let currentDay = 0;

// ── RENDER MENU ──
function renderAll(){
  const content = document.getElementById('content');
  content.innerHTML = '';
  MENU.forEach((day,di)=>{
    const panel = document.createElement('div');
    panel.className = 'day-panel' + (di===0?' active':'');
    panel.id = 'day-'+di;
    SECTIONS.forEach(sec=>{
      const items = day[sec.key];
      const section = document.createElement('div');
      section.className = 'meal-section';
      section.innerHTML = `
        <div class="section-header">
          <span class="section-label">${sec.label}</span>
          <span class="section-time">${sec.time}</span>
          <div class="section-line"></div>
        </div>
        <div class="items-grid" id="grid-${di}-${sec.key}"></div>
      `;
      panel.appendChild(section);
      // items rendered after append
    });
    content.appendChild(panel);
    // now fill grids
    SECTIONS.forEach(sec=>{
      const grid = document.getElementById(`grid-${di}-${sec.key}`);
      day[sec.key].forEach(item=>{
        grid.appendChild(makeCard(di,sec.key,item));
      });
    });
  });
}

function makeCard(di, secKey, item){
  const key = `${di}_${secKey}_${item.n}`;
  const card = document.createElement('div');
  card.className = 'item-card';
  card.id = 'card-'+key.replace(/\s/g,'_');
  card.innerHTML = `
    <div class="item-name">${item.n}</div>
    <div class="item-bottom">
      <span class="item-price">₹${item.p} <span>/ serving</span></span>
      <div class="add-btn" id="addbtn-${key.replace(/\W/g,'_')}">
        <button class="quick-add" onclick="addItem('${di}','${secKey}','${item.n.replace(/'/g,"\\'")}',${item.p})">+ Add</button>
      </div>
    </div>
  `;
  return card;
}

// ── TABS ──
document.getElementById('tabs').addEventListener('click',e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const di = +btn.dataset.day;
  currentDay = di;
  document.querySelectorAll('.day-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('day-'+di).classList.add('active');
});

// ── CART LOGIC ──
function addItem(di, secKey, name, price){
  const key = `${di}_${secKey}_${name}`;
  if(cart[key]){
    cart[key].qty++;
  } else {
    cart[key] = {name, price, qty:1, day:DAYS[di], section:secKey};
  }
  updateAddBtn(di, secKey, name, price);
  updateCartUI();
  showToast(`${name} added!`);
}

function changeQty(di, secKey, name, price, delta){
  const key = `${di}_${secKey}_${name}`;
  if(!cart[key]) return;
  cart[key].qty += delta;
  if(cart[key].qty <= 0) delete cart[key];
  updateAddBtn(di, secKey, name, price);
  updateCartUI();
}

function removeItem(key){
  delete cart[key];
  updateCartUI();
  // reset button if on current day
  const parts = key.split('_');
  if(+parts[0] === currentDay){
    // find button and reset
    const btnId = 'addbtn-'+key.replace(/\W/g,'_');
    const btn = document.getElementById(btnId);
    if(btn){
      const [di,secKey,...rest] = key.split('_');
      const name = rest.join('_');
      // find price from menu
      const item = MENU[di][secKey].find(i=>i.n===name);
      if(item) btn.innerHTML = `<button class="quick-add" onclick="addItem('${di}','${secKey}','${name.replace(/'/g,"\\'")}',${item.p})">+ Add</button>`;
    }
  }
}

function updateAddBtn(di, secKey, name, price){
  const key = `${di}_${secKey}_${name}`;
  const btnId = 'addbtn-'+key.replace(/\W/g,'_');
  const wrap = document.getElementById(btnId);
  if(!wrap) return;
  const qty = cart[key] ? cart[key].qty : 0;
  if(qty === 0){
    wrap.innerHTML = `<button class="quick-add" onclick="addItem('${di}','${secKey}','${name.replace(/'/g,"\\'")}',${price})">+ Add</button>`;
  } else {
    wrap.innerHTML = `
      <button class="qty-btn" onclick="changeQty('${di}','${secKey}','${name.replace(/'/g,"\\'")}',${price},-1)">−</button>
      <span class="qty-display">${qty}</span>
      <button class="qty-btn" onclick="changeQty('${di}','${secKey}','${name.replace(/'/g,"\\'")}',${price},1)">+</button>
    `;
  }
}

function updateCartUI(){
  const keys = Object.keys(cart);
  const total = keys.reduce((s,k)=>s+cart[k].price*cart[k].qty,0);
  const count = keys.reduce((s,k)=>s+cart[k].qty,0);

  // FAB
  const fab = document.getElementById('cartFab');
  fab.classList.toggle('hidden', count===0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('totalAmt').textContent = '₹'+total;

  // Cart items
  const ci = document.getElementById('cartItems');
  const em = document.getElementById('emptyMsg');
  ci.innerHTML = '';
  em.style.display = keys.length ? 'none' : 'block';

  keys.forEach(k=>{
    const item = cart[k];
    const div = document.createElement('div');
    div.className = 'cart-item';
    const parts = k.split('_');
    const di = parts[0], secKey = parts[1];
    const name = item.name;
    div.innerHTML = `
      <div class="ci-info">
        <div class="ci-name">${name}</div>
        <div class="ci-price">₹${item.price} × ${item.qty} = ₹${item.price*item.qty}</div>
      </div>
      <div class="ci-ctrl">
        <button class="ci-btn" onclick="changeQty('${di}','${secKey}','${name.replace(/'/g,"\\'")}',${item.price},-1);renderCartDrawer()">−</button>
        <span class="ci-qty">${item.qty}</span>
        <button class="ci-btn" onclick="changeQty('${di}','${secKey}','${name.replace(/'/g,"\\'")}',${item.price},1);renderCartDrawer()">+</button>
      </div>
      <button class="ci-remove" onclick="removeItem('${k}');renderCartDrawer()" title="Remove">🗑</button>
    `;
    ci.appendChild(div);
  });

  // Proceed button
  const pb = document.getElementById('proceedBtn');
  if(pb) pb.disabled = keys.length === 0;
}

function renderCartDrawer(){ updateCartUI(); }

  document.getElementById('drawer').classList.remove('open');

function showCheckout(){
  if(Object.keys(cart).length===0){ showToast('Add items first!'); return; }
  document.getElementById('cartSection').classList.add('hidden');
  document.getElementById('checkoutSection').classList.add('visible');
  document.getElementById('cartActions').style.display='none';
  document.getElementById('checkoutActions').style.display='block';
}
function showCart(){
  document.getElementById('cartSection').classList.remove('hidden');
  document.getElementById('checkoutSection').classList.remove('visible');
  document.getElementById('cartActions').style.display='block';
  document.getElementById('checkoutActions').style.display='none';
}

// ── WHATSAPP ORDER ──
function placeOrder(){
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();

  if(!name){ showToast('Please enter your name'); return; }
  if(!phone || phone.length < 10){ showToast('Please enter valid phone number'); return; }
  if(!address){ showToast('Please enter delivery address'); return; }

  const keys = Object.keys(cart);
  if(keys.length===0){ showToast('Cart is empty!'); return; }

  let orderLines = '';
  let total = 0;

  // Group by day
  const byDay = {};
  keys.forEach(k=>{
    const item = cart[k];
    if(!byDay[item.day]) byDay[item.day] = [];
    byDay[item.day].push(item);
    total += item.price * item.qty;
  });

  Object.keys(byDay).forEach(day=>{
    orderLines += `\n📅 *${day}*\n`;
    byDay[day].forEach(item=>{
      orderLines += `  • ${item.name} × ${item.qty} = ₹${item.price*item.qty}\n`;
    });
  });

  const msg =
`🌿 *New Order — V MR HEALTH* 🌿

*Customer Details:*
👤 Name: ${name}
📱 Phone: ${phone}
📍 Address: ${address}

*Order Summary:*${orderLines}
━━━━━━━━━━━━━━━
💰 *Total: ₹${total}*
━━━━━━━━━━━━━━━

_Order placed via vmrhealth.shop_`;

  const waURL = 'https://wa.me/918008804486?text=' + encodeURIComponent(msg);
  window.open(waURL, '_blank');
}

// ── TOAST ──
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
